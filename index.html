<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS | Cyber Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="circuit-overlay"></div>
    <div class="decor-line t-l-1"></div>
    <div class="decor-line t-l-2"></div>

    <div class="container">
        <nav class="sidebar">
            <div class="logo">STUDY_OS.v1</div>
            <button class="nav-btn active" onclick="showView('dashboard')">Dashboard</button>
            <button class="nav-btn" onclick="toggleModal('todo-modal', true)">To Do List</button>
            <button class="nav-btn" onclick="toggleModal('notes-modal', true)">Quick Notes</button>
            <div class="ai-status">AI_BOT: STANDBY</div>
        </nav>

        <main class="content">
            <header class="header">
                <input type="text" class="search" placeholder="SEARCH SYSTEM...">
                <div id="clock">00:00:00</div>
            </header>

            <section id="dashboard" class="sub-page active">
                <h1 class="glitch-text">Active Subjects</h1>
                <div class="grid">
                    <div class="card" onclick="showView('math')"><h3>MATH</h3></div>
                    <div class="card" onclick="showView('chem')"><h3>CHEMISTRY</h3></div>
                    <div class="card" onclick="showView('physics')"><h3>PHYSICS</h3></div>
                    <div class="card" onclick="showView('geo')"><h3>GEOGRAPHY</h3></div>
                    <div class="card" onclick="showView('hist')"><h3>HISTORY</h3></div>
                    <div class="card" onclick="showView('bio')"><h3>BIOLOGY</h3></div>
                </div>
            </section>

            <section id="subject-detail" class="sub-page">
                <h1 id="sub-title">SUBJECT</h1>
                <button class="action-btn" onclick="showView('dashboard')">← RETURN</button>
                <div class="subject-layout">
                    <div class="box main-box">
                        <h3>Lessons</h3>
                        <p>> Unit 01: System Launch</p>
                        <p>> Unit 02: Core Data Processing</p>
                    </div>
                    <div class="side-boxes">
                        <div class="box">
                            <h3>Resources</h3>
                            <p>📄 data_sheet.pdf</p>
                        </div>
                        <div class="box">
                            <h3>Status</h3>
                            <p>COMPLETION: 0%</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="overlay" id="global-overlay" onclick="toggleModal('', false)"></div>
    
    <div class="modal" id="todo-modal">
        <h3>TASK_MANAGER</h3>
        <div id="todo-items"></div>
        <input type="text" id="todo-input" placeholder="Enter new task...">
        <button class="action-btn" onclick="addTask()">ADD TASK</button>
        <button class="action-btn close" onclick="toggleModal('todo-modal', false)">EXIT</button>
    </div>

    <div class="modal" id="notes-modal">
        <h3>QUICK_NOTES</h3>
        <textarea id="note-content" rows="10" placeholder="Type here..."></textarea>
        <button class="action-btn close" onclick="toggleModal('notes-modal', false)">SAVE_SESSION</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
